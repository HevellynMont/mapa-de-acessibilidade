<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Perfil - Usuário</title>
    <link rel="stylesheet" href="../css/perfil-user.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<div class="modal-overlay" id="modal-editar-local">
    <div class="modal-content">
        <h2>Editar Local</h2>

        <form id="form-editar-local">
            <label>Nome do local:</label>
            <input type="text" id="editar-local-nome" required>

            <label>Descrição:</label>
            <textarea id="editar-local-descricao" rows="4"></textarea>

            <label>Endereço:</label>
            <input type="text" id="editar-local-endereco" required>


            <div class="modal-actions">
                <button type="submit" class="primary-btn">Salvar</button>
                <button type="button" id="cancelar-edicao-local" class="cancelar-btn">Cancelar</button>
            </div>
        </form>
    </div>
</div>

<body>

    <main class="profile-container">

        <nav class="profile-nav">
            <a href="mapa.html"><i class="fa-solid fa-chevron-left"></i> Voltar</a>
        </nav>

        <div class="profile-details">

            <div class="info">
                <div class="info-field">
                    <strong>Nome:</strong> <span id="user-name">...</span>
                </div>
                <a href="#" id="btn-trocar-nome" class="change-btn">Trocar nome</a>
            </div>

            <div class="info">
                <div class="info-field">
                    <strong>E-mail:</strong> <span id="user-email">...</span>
                </div>
                <a href="#" id="btn-trocar-email" class="change-btn">Trocar e-mail</a>
            </div>

            <div class="info">
                <div class="info-field"><strong>Senha:</strong> ************</div>
                <a href="redefinir_senha.html" class="change-btn">Trocar senha</a>
            </div>

            <a href="login.html" class="logout-btn">Deslogar</a>
        </div>

        <div class="modal-overlay" id="modal-edicao-usuario">
            <div class="modal-content">
                <h2>Editar Informação</h2>
                <form id="form-edicao-usuario">
                    <div class="form-group">
                        <label id="label-edicao-usuario" for="input-edicao-usuario">Novo valor:</label>
                        <input type="text" id="input-edicao-usuario" required>
                    </div>

                    <div class="modal-actions">
                        <button type="button" id="btn-cancelar-edicao-usuario" class="cancelar-btn">Cancelar</button>
                        <button type="submit" class="salvar-btn">Salvar</button>
                    </div>
                </form>
            </div>
        </div>

        <hr class="divider">

        <section class="profile-activity">

            <div class="comments-section" id="comments-container">
                <h2>Comentários:</h2>
            </div>

            <div class="locations-section" id="locations-container">
                <h2>Locais marcados como acessível:</h2>
            </div>

            <script src="../js/perfil-user.js"></script>

        </section>

    </main>

    <div class="modal-overlay" id="modal-avatar">

        <div class="modal-content">
            <h2>Escolha um avatar</h2>

            <div class="avatar-grid">
                <!-- colocar link pra imagens -->
            </div>

            <div class="modal-actions">
                <button id="btn-cancelar-avatar" class="cancelar-btn">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Modal de Edição de Comentário -->
    <div class="modal-overlay" id="modal-editar-comentario">
        <div class="modal-content modal-editar">
            <h2>Editar Comentário</h2>

            <form id="form-editar-comentario">
                <input type="hidden" id="edit-comentario-id">

                <div class="form-group">
                    <label for="edit-local-nome">Local:</label>
                    <input type="text" id="edit-local-nome" readonly>
                </div>

                <div class="form-group">
                    <label for="edit-descricao">Descrição:</label>
                    <textarea id="edit-descricao" rows="4" required></textarea>
                </div>

                <div class="form-group">
                    <label for="edit-nota">Nota (1-5):</label>
                    <input type="number" id="edit-nota" min="1" max="5" required>
                </div>

                <div class="form-group">
                    <label>Tags de Acessibilidade:</label>
                    <div id="edit-tags-container" class="tags-container">
                        <!-- Tags serão carregadas dinamicamente -->
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" id="btn-cancelar-edicao" class="cancelar-btn">Cancelar</button>
                    <button type="submit" class="salvar-btn">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/perfil-user.js"></script>


</body>

</html>
