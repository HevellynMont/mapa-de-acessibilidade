<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar - Mapa de Acessibilidade</title>
    <link rel="icon" href="../image/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <h1>MAPA DE<br>ACESSIBILIDADE</h1>
            <div class="description">
                <p class="desc-title">Descubra lugares acessíveis.<br>Compartilhe inclusão.</p>
                <p class="desc-subtitle">Junte-se a nós nessa jornada por uma cidade sem barreiras!</p>
            </div>
        </div>

        <div class="right-panel">
            <h2>Cadastrar</h2>
            <form id="cadastroForm">
                <div class="input-group">
                    <input type="text" id="nome" placeholder="Digite seu nome..." required>
                </div>
                <div class="input-group">
                    <input type="email" id="email" placeholder="Digite seu email..." required>
                </div>
                <div class="input-group">
                    <input type="password" id="senha" placeholder="Digite sua senha..." required>
                </div>
                <div class="toggle-row">
                    <div class="toggle">
                        <input type="radio" id="user" name="tipo" value="usuario" checked>
                        <label for="user">Usuário comum</label>
                        <input type="radio" id="prop" name="tipo" value="proprietario">
                        <label for="prop">Proprietário</label>
                    </div>
                    <a href="login.html" class="logar">Logar</a>
                </div>
                <button type="submit" class="btn-cadastrar">Cadastrar</button>
            </form>
        </div>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/cadastro.js"></script>
</body>
</html>
